<!doctype html><html lang='pt-BR'><head>
<meta name="robots" content="noindex,nofollow"><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='robots' content='noindex,nofollow'><title>OPR Dois A</title><style>
:root{--navy:#1A3470;--navy2:#122550;--bg:#eef1f6;--paper:#ffffff;--ink:#1c2733;
  --muted:#5a6472;--linha:#e3e7ee;--alerta:#b3261e}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 Arial,'Segoe UI',system-ui,sans-serif;background:var(--bg);
  color:var(--ink);display:flex;min-height:100vh}
.sb{width:240px;flex:0 0 240px;background:linear-gradient(180deg,var(--navy),var(--navy2));
  color:#fff;padding:22px 18px;display:flex;flex-direction:column;position:sticky;top:0;
  align-self:flex-start;height:100vh}
.sb h1{font-size:19px;font-weight:800;margin:0 0 2px}
.sb .sub{font-size:11px;color:#c7d1ea;margin-bottom:22px}
.pagenav{display:flex;flex-direction:column;gap:8px;margin-bottom:auto}
.pagenav button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);
  color:#fff;padding:10px 12px;border-radius:8px;font:700 12px Arial;text-align:left;
  cursor:pointer}
.pagenav button.ativo{background:#fff;color:var(--navy)}
.carimbo{font-size:10.5px;color:#c7d1ea;border-top:1px solid rgba(255,255,255,.2);
  padding-top:12px;margin-top:14px}
.main{flex:1;min-width:0;padding:26px;overflow-x:hidden}
.livro{perspective:2400px;max-width:960px;margin:0 auto}
.folha{position:relative;min-height:640px;transition:transform .7s;transform-style:preserve-3d}
.livro.p2 .folha{transform:rotateY(180deg)}
.pg{position:absolute;inset:0;backface-visibility:hidden;background:var(--paper);
  border-radius:10px;box-shadow:0 8px 26px rgba(20,30,60,.12);padding:24px;overflow:auto}
.pg2{transform:rotateY(180deg)}
h2{font:800 18px Arial;color:var(--navy);margin:0 0 14px}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.kpi{background:#f4f6fb;border:1px solid var(--linha);border-radius:8px;padding:12px 16px;
  min-width:120px}
.kpi .v{font:800 24px Arial;color:var(--navy)}
.kpi .l{font-size:11px;color:var(--muted);margin-top:2px}
table{border-collapse:collapse;width:100%;margin:8px 0 16px}
th{background:var(--navy);color:#fff;padding:7px 10px;text-align:left;font:700 12px Arial}
td{padding:7px 10px;border-bottom:1px solid var(--linha);font-size:12.5px;vertical-align:top}
a{color:var(--navy)}
.alerta{color:var(--alerta);font-weight:700}
.filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.filtros select{padding:7px 10px;border:1px solid var(--linha);border-radius:6px;
  font:12.5px Arial;background:#fff}
.filtros button{padding:7px 12px;border:1px solid var(--linha);border-radius:6px;
  background:#f4f6fb;font:700 12px Arial;cursor:pointer}
.contagem{font-size:11.5px;color:var(--muted);margin-bottom:8px}
@media(max-width:760px){
  body{flex-direction:column}
  .sb{width:100%;flex:none;position:static;height:auto;flex-direction:row;flex-wrap:wrap;
    align-items:center;gap:14px 20px}
  .sb h1{width:100%}
  .pagenav{flex-direction:row;margin:0}
  .carimbo{border-top:none;margin:0;padding:0}
  .main{padding:14px}
  .livro{perspective:none;max-width:100%}
  .folha{min-height:0;transition:none;transform-style:flat}
  .livro.p2 .folha{transform:none}
  .pg{position:static;display:none;box-shadow:none;padding:14px}
  .pg1{display:block}
  .livro.p2 .pg1{display:none}
  .livro.p2 .pg2{display:block;transform:none}
  .tb-detalhe{display:block;overflow-x:auto;white-space:nowrap}
  .filtros{gap:8px}
  .filtros select,.filtros button{flex:1 1 auto;min-width:0}
}
</style></head><body>
<aside class="sb">
  <div><h1>OPR Dois A</h1><div class="sub">retrato diário · 10 empreendimentos</div></div>
  <nav class="pagenav">
    <button id="btnVisao" class="ativo" type="button">Visão geral</button>
    <button id="btnDetalhe" type="button">Detalhe · tarefas</button>
  </nav>
  <div class="carimbo">retrato de 14/08 às 06h00</div>
</aside>
<main class="main">
  <div class="livro" id="livro"><div class="folha">
    <section class="pg pg1">
      <h2>Visão geral</h2>
      <div class="kpis" id="kpis"></div>
      <table><thead><tr><th>Empreendimento</th><th>Situação</th></tr></thead>
        <tbody id="tbRanking"></tbody></table>
    </section>
    <section class="pg pg2">
      <h2>Detalhe · tarefas</h2>
      <div class="filtros">
        <select id="fEmp"></select>
        <select id="fResp"></select>
        <select id="fCorte">
          <option value="">Corte: todos</option>
          <option value="até 7d">até 7d</option>
          <option value="7–30d">7–30d</option>
          <option value="30–90d">30–90d</option>
          <option value="90+d">90+d</option>
        </select>
        <button id="btnLimpar" type="button">Limpar filtros</button>
      </div>
      <div class="contagem" id="contagem"></div>
      <table class="tb-detalhe">
        <thead><tr><th>Tarefa</th><th>Empreendimento</th><th>Responsável</th>
          <th>Status</th><th>Grupo</th><th>Parada há</th></tr></thead>
        <tbody id="tbDetalhe"></tbody>
      </table>
    </section>
  </div></div>
</main>
<script>window.OPR_DADOS={"carimbo": "retrato de 14/08 às 06h00", "ranking": [{"emp": "Areia Preta", "falha_coleta": false, "sumiu": 0, "travadas30": 0, "orfas": 0, "vivas": 0}, {"emp": "Campos Sales", "falha_coleta": false, "sumiu": 0, "travadas30": 0, "orfas": 0, "vivas": 0}, {"emp": "Caraúbas", "falha_coleta": false, "sumiu": 0, "travadas30": 0, "orfas": 0, "vivas": 0}, {"emp": "Home Serra", "falha_coleta": false, "sumiu": 0, "travadas30": 0, "orfas": 0, "vivas": 0}, {"emp": "Jardins do Potengi", "falha_coleta": false, "sumiu": 0, "travadas30": 0, "orfas": 0, "vivas": 0}, {"emp": "Joaquim Fabricio", "falha_coleta": false, "sumiu": 0, "travadas30": 0, "orfas": 0, "vivas": 0}, {"emp": "Maracajaú", "falha_coleta": false, "sumiu": 0, "travadas30": 0, "orfas": 0, "vivas": 0}, {"emp": "Reserva Bonfim", "falha_coleta": false, "sumiu": 0, "travadas30": 0, "orfas": 0, "vivas": 0}, {"emp": "Reserva Pipa", "falha_coleta": false, "sumiu": 0, "travadas30": 0, "orfas": 0, "vivas": 0}, {"emp": "Tibau do Sul", "falha_coleta": false, "sumiu": 0, "travadas30": 0, "orfas": 0, "vivas": 0}], "tasks": [], "cfg": {"empreendimentos": ["Tibau do Sul", "Reserva Pipa", "Areia Preta", "Jardins do Potengi", "Caraúbas", "Home Serra", "Joaquim Fabricio", "Campos Sales", "Reserva Bonfim", "Maracajaú"], "carimbos_importacao": ["2026-04-08", "2026-05-21"], "travada_dias": 30, "hoje_iso": "2026-08-14"}};</script><script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function viva(t,carimbos){
  return t.status_tipo!=='done' && t.status_tipo!=='closed'
    && carimbos.indexOf(t.atualizada)===-1;}
function diasParada(t,hojeIso){
  if(!t.atualizada) return 0;
  var hoje=new Date(hojeIso+'T00:00:00'), d=new Date(t.atualizada+'T00:00:00');
  return Math.round((hoje-d)/86400000);}
function faixaAging(dias){
  if(dias<=7) return 'até 7d';
  if(dias<=30) return '7–30d';
  if(dias<=90) return '30–90d';
  return '90+d';}
function kpiHtml(v,l){return '<div class="kpi"><div class="v">'+v+'</div><div class="l">'+esc(l)+'</div></div>';}

function renderKpis(dados){
  var vivas=0,trav=0,orfas=0,falhas=0;
  dados.ranking.forEach(function(r){
    vivas+=r.vivas; trav+=r.travadas30; orfas+=r.orfas; if(r.falha_coleta) falhas++;});
  document.getElementById('kpis').innerHTML =
    kpiHtml(vivas,'vivas') + kpiHtml(trav,'travadas 30+') +
    kpiHtml(orfas,'sem responsável') + kpiHtml(falhas,'falha de coleta hoje');
}
function renderRanking(dados){
  document.getElementById('tbRanking').innerHTML = dados.ranking.map(function(r){
    var estado = r.falha_coleta ? '<span class="alerta">coleta falhou hoje</span>'
      : (r.vivas===0 ? 'sem movimento'
         : r.vivas+' vivas · '+r.travadas30+' travadas 30+ · '+r.orfas+' sem responsável');
    return '<tr><td>'+esc(r.emp)+'</td><td>'+estado+'</td></tr>';
  }).join('');
}
function popularFiltros(dados){
  var selEmp=document.getElementById('fEmp');
  selEmp.innerHTML = '<option value="">Empreendimento: todos</option>' +
    dados.cfg.empreendimentos.map(function(e){
      return '<option value="'+esc(e)+'">'+esc(e)+'</option>';}).join('');
  var pessoas={};
  dados.tasks.forEach(function(t){
    (t.responsaveis&&t.responsaveis.length?t.responsaveis:['SEM RESPONSÁVEL']).forEach(
      function(n){pessoas[n]=1;});});
  var nomes=Object.keys(pessoas).sort();
  var selResp=document.getElementById('fResp');
  selResp.innerHTML = '<option value="">Responsável: todos</option>' +
    nomes.map(function(n){return '<option value="'+esc(n)+'">'+esc(n)+'</option>';}).join('');
}
function aplicarFiltros(){
  var dados=window.OPR_DADOS;
  var fEmp=document.getElementById('fEmp').value;
  var fResp=document.getElementById('fResp').value;
  var fCorte=document.getElementById('fCorte').value;
  var linhas = dados.tasks
    .filter(function(t){return viva(t,dados.cfg.carimbos_importacao);})
    .filter(function(t){return !fEmp || t.emp===fEmp;})
    .filter(function(t){
      if(!fResp) return true;
      var resp=(t.responsaveis&&t.responsaveis.length)?t.responsaveis:['SEM RESPONSÁVEL'];
      return resp.indexOf(fResp)!==-1;})
    .map(function(t){return {t:t,dias:diasParada(t,dados.cfg.hoje_iso)};})
    .filter(function(x){return !fCorte || faixaAging(x.dias)===fCorte;})
    .sort(function(a,b){return b.dias-a.dias;});
  document.getElementById('contagem').textContent = linhas.length+' tarefa(s)';
  document.getElementById('tbDetalhe').innerHTML = linhas.map(function(x){
    var t=x.t;
    var resp=(t.responsaveis&&t.responsaveis.length)?t.responsaveis.map(esc).join(', '):'SEM RESPONSÁVEL';
    return '<tr><td><a href="'+esc(t.url)+'" target="_blank" rel="noopener">'+esc(t.nome)+'</a></td>'+
      '<td>'+esc(t.emp)+'</td><td>'+resp+'</td><td>'+esc(t.status)+'</td>'+
      '<td>'+(t.mae_nome?esc(t.mae_nome):'—')+'</td><td>'+x.dias+'d</td></tr>';
  }).join('');
}
function irPara(pagina){
  var l=document.getElementById('livro');
  var btnV=document.getElementById('btnVisao'), btnD=document.getElementById('btnDetalhe');
  if(pagina===2){l.classList.add('p2'); btnD.classList.add('ativo'); btnV.classList.remove('ativo');}
  else{l.classList.remove('p2'); btnV.classList.add('ativo'); btnD.classList.remove('ativo');}
}
document.addEventListener('DOMContentLoaded', function(){
  var dados=window.OPR_DADOS;
  popularFiltros(dados);
  renderKpis(dados);
  renderRanking(dados);
  aplicarFiltros();
  document.getElementById('btnVisao').addEventListener('click', function(){irPara(1);});
  document.getElementById('btnDetalhe').addEventListener('click', function(){irPara(2);});
  document.getElementById('fEmp').addEventListener('change', aplicarFiltros);
  document.getElementById('fResp').addEventListener('change', aplicarFiltros);
  document.getElementById('fCorte').addEventListener('change', aplicarFiltros);
  document.getElementById('btnLimpar').addEventListener('click', function(){
    document.getElementById('fEmp').value='';
    document.getElementById('fResp').value='';
    document.getElementById('fCorte').value='';
    aplicarFiltros();
  });
});
</script></body></html>
